<!DOCTYPE html>
<html lang="es">
{{ partial "head.html" . }}
<body>
  {{ partial "header.html" . }}
  <main class="container">
    <h1>{{ .Title }}</h1>
    <div class="content">
      {{ .Content }}
    </div>

    <section class="latest-posts">
      <h2>Últimas entradas del blog</h2>
      <ul>
        {{ range first 3 (where .Site.RegularPages "Section" "blog") }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            <span class="post-date">({{ .Date.Format "02/01/2006" }})</span>
          </li>
        {{ end }}
      </ul>
    </section>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
