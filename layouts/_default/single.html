<!DOCTYPE html>
<html lang="es">
{{ partial "head.html" . }}
<body>
  {{ partial "header.html" . }}
  <main class="container">
    <article>
      <h1>{{ .Title }}</h1>
      {{ if eq .Section "blog" }}
        <p class="post-meta"><em>Publicado el {{ .Date.Format "02/01/2006" }}</em></p>
      {{ end }}
      <div class="content">
        {{ .Content }}
      </div>
    </article>
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
